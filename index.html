<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Night Invitation ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e0a1a8, #4076f5);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        margin: 0;
        overflow: hidden;
    }

    .card {
        background: rgb(245, 241, 241);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        width: 90%;
        max-width: 600px;
    }

    h1 {
        color: #ed0732;
    }

    button {
        padding: 12px 25px;
        margin: 10px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 18px;
    }

    .yes-btn {
        background: #4CAF50;
        color: white;
    }

    .yes-btn:hover {
        background: #45a049;
        scale: 1.1;
        box-shadow: 0 0 15px rgba(76, 175, 80, 0.7);
        transition: all 0.2s ease;
    }

    .choice-btn {
        background: #ff4d6d;
        color: white;
    }

    .choice-btn:hover {
        background: #ff1a4d;
        scale: 1.1;
        box-shadow: 0 0 15px rgba(255, 77, 109, 0.7);
        transition: all 0.2s ease;
    }

    #noBtn {
        background: #777;
        color: white;
        position: absolute;
    }

    .fade {
        animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
        from {opacity:0;}
        to {opacity:1;}
    }
</style>
</head>

<body>
    
<!--Slide for resturaunt choice-->

<div class="card fade" id="app">
    <h1>❤️ Quick Question ❤️</h1>
    <p>Will you go on a date with me?</p>

    <button class="yes-btn" onclick="startQuestions()">Yes 😊</button>
    <button id="noBtn">No 😢</button>
</div>


<script>

const noBtn = document.getElementById("noBtn");

function moveButton() {
    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);

const questions = [
{
    question: "What sounds best?",
    options: ["Pho 🍜", "Chicken Nuggets 🧽", "Sushi 🍣"]
},
{
    question: "Choose a dessert:",
    options: ["Ice Cream 🍨", "Cake 🍰", "Fruits 🍍🍎🍓🍇"]
},
{
    question: "Pick an after dinner vibe:",
    options: ["Movie 🎬", "Walk 🌅", "Mini Golf ⛳"]
},
];

let currentQuestion = 0;
let answers = [];

function startQuestions() {
    showQuestion();
}

function showQuestion() {

    if(currentQuestion >= questions.length) {
        showFinalPage();
        return;
    }

    const q = questions[currentQuestion];

    document.getElementById("app").innerHTML = `
        <h1>${q.question}</h1>
        ${q.options.map(option =>
            `<button class="choice-btn"
                onclick="selectAnswer('${option}')">
                ${option}
            </button>`
        ).join("<br><br>")}
    `;
}

function selectAnswer(answer) {
    answers.push(answer);
    currentQuestion++;
    showQuestion();
}

function showFinalPage() {

    document.getElementById("app").innerHTML = `
        <h1>🎉 It's a Date! 🎉</h1>

        <p>Based on your answers:</p>

        <p><strong>Food:</strong> ${answers[0]}</p>
        <p><strong>Activity:</strong> ${answers[1]}</p>
        <p><strong>Dessert:</strong> ${answers[2]}</p>

        <hr>

        <h2> Saturday at 11:00 AM?</h2>

        <p>
        I'd love to take you out, Lanny & Perry :) ❤️
        ~ Made by Teaver 🐿️❤️🦫
        </p>
    `;
}

moveButton();

</script>

</body>
</html>
